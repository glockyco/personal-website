pre-commit:
  parallel: true
  commands:
    prettier:
      glob: '*.{js,ts,svelte,css,json,md}'
      run: pnpm prettier --check {staged_files}
    eslint:
      glob: '*.{js,ts,svelte}'
      run: pnpm eslint {staged_files}
    svelte-check:
      run: pnpm check
    plans-docs:
      glob: 'docs/plans/**/*.md'
      run: omp-plans index && omp-plans check
      stage_fixed: true
      skip:
        - run: '! command -v omp-plans'

commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}
